<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>LOUV 🎉</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #celebrateBtn {
      padding: 18px 40px;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transition: transform 0.15s;
      z-index: 10;
    }

    #celebrateBtn:hover {
      transform: scale(1.08);
    }

    #louv {
      position: absolute;
      font-size: clamp(80px, 20vw, 250px);
      font-weight: 900;
      color: white;
      letter-spacing: 10px;
      opacity: 0;
      transform: scale(0.2) rotate(-10deg);
      transition: all 0.7s cubic-bezier(.17,.67,.35,1.5);
      pointer-events: none;
      text-shadow: 0 0 30px rgba(255,255,255,0.5);
    }

    #louv.show {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
  </style>

</head>

<body>

<button id="celebrateBtn">CLICK ME 🎉</button>

  <div id="louv">LOUV</div>

<canvas id="confetti"></canvas>

  <script>
    const button = document.getElementById("celebrateBtn");
    const louv = document.getElementById("louv");
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let pieces = [];

    function createConfetti() {
      pieces = [];

      for (let i = 0; i < 250; i++) {
        pieces.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          size: Math.random() * 10 + 5,
          speedX: (Math.random() - 0.5) * 18,
          speedY: Math.random() * -18 - 5,
          gravity: 0.35,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 15,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`
        });
      }

      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pieces.forEach((p) => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.speedY += p.gravity;
        p.rotation += p.rotationSpeed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);

        ctx.fillStyle = p.color;

        ctx.fillRect(
          -p.size / 2,
          -p.size / 2,
          p.size,
          p.size * 0.6
        );

        ctx.restore();
      });

      pieces = pieces.filter(
        p => p.y < window.innerHeight + 50
      );

      if (pieces.length > 0) {
        requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    button.addEventListener("click", () => {

      // Make the button disappear
      button.style.display = "none";

      // Show LOUV
      setTimeout(() => {
        louv.classList.add("show");
        createConfetti();
      }, 150);
    });

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
